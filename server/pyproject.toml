[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synchro-desktop"
version = "0.3.1"
description = "Synchro desktop service for local media, clipboard and browser handoff"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["qrcode==8.2", "zeroconf==0.151.5"]

[project.scripts]
Synchro = "potbridge.__main__:main"
