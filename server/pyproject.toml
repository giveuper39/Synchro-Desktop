[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "potplayer-handoff"
version = "0.3.1"
description = "LAN video streaming and playback handoff between PotPlayer and Android"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["qrcode==8.2", "zeroconf==0.151.5"]

[project.scripts]
potplayer-handoff = "potbridge.__main__:main"
